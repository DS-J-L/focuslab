name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: Windows Python 3.11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv==0.9.5
      - name: Install locked development environment
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Test (GUI tests run off-screen)
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
      - name: CLI smoke (headless, no sensors)
        run: uv run focuslab --check
      - name: Build wheel and source distribution
        run: uv build
