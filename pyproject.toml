[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "focuslab"
version = "0.2.2"
description = "Local-first Windows work-pattern observation app (prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{name = "FocusLab contributors"}]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.11"]
dependencies = [
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.26,<3",
    "onnxruntime>=1.19,<2",
    "opencv-contrib-python>=4.10,<6",
    "psutil>=6,<8",
    "pyside6>=6.8,<6.11",
    "pywin32>=308 ; sys_platform == 'win32'",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
focuslab = "focuslab.__main__:main"
# Launched by Chrome/Edge through Native Messaging (see focuslab.browser.install).
focuslab-native-host = "focuslab.browser.native_host:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-qt>=4.4,<5",
    "ruff>=0.9,<1",
]
# Windows .exe build: uv run --group build python scripts/build_exe.py
build = [
    "pyinstaller>=6.11,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/focuslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
