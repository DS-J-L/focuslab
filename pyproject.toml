[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "focuslab"
version = "0.0.1"
description = "Local-first Windows work-pattern observation app (initial scaffold)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [{name = "FocusLab contributors"}]
classifiers = ["Development Status :: 1 - Planning", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3.11"]
dependencies = []

[project.scripts]
focuslab = "focuslab.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/focuslab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
